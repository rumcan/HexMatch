# E13: full Playwright viewport matrix (desktop + iPhone + android-small +
# android-landscape). PR CI runs desktop-chromium only so the required check
# stays fast; this job keeps G4/G5 mobile assertions from rotting.
name: e2e-nightly
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-nightly
          path: playwright-report/
