name: slow simulations
# These are deliberately not part of the required PR default-suite check.
# Rival-stall failures remain tracked in #431.
on:
  workflow_dispatch:
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:slow
