name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: atlas matches cells (G7/K1)
        run: |
          # K1: the packer reads only git-tracked sources (Kenney PNGs +
          # tools/iso-atlas.cells.json), so no pre-step is needed.
          node tools/make-derived-art.mjs
          npm run slice-atlas
          git diff --exit-code assets/iso-atlas/ src/iso/kenny/derived/

  # E13: Playwright never ran in CI. Desktop chromium on every PR; full
  # viewport matrix is the nightly workflow so G4/G5 mobile coverage is
  # not dropped. Iso layout assertions run on every project.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: run e2e (post failures to the PR on error)
        run: |
          set -o pipefail
          npx playwright test --project=desktop-chromium 2>&1 | tee /tmp/pw.log || {
            echo "PLAYWRIGHT_FAILED"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              grep -aE "✘|✓|failed|passed|Error|expect|at .*spec" /tmp/pw.log \
                | grep -av "npm warn" | tail -n 120 > /tmp/pw-fail.txt || true
              jq -Rs --arg id "pw-${{ github.run_id }}" \
                '{body: ("### e2e failure (run " + $id + ")\n```\n" + . + "\n```")}' \
                /tmp/pw-fail.txt > /tmp/pw-body.json
              curl -sf -X POST -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -d @/tmp/pw-body.json || echo "(could not post comment)"
            fi
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/