name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: atlas matches cells (G7)
        run: |
          # slice-atlas reads tools/opengfx-sprites.json, a gitignored build
          # artifact. Without this line the step dies on "missing ... run
          # parse-pnml.mjs first" before it ever compares the atlas.
          node tools/parse-pnml.mjs
          npm run slice-atlas
          # The group sheets (groups/*.png) are cut from the atlas (byte-checked
          # here) by groups@2x.json (also checked); their PNG bytes differ by OS
          # encoder (sharp on Windows vs Linux) with identical pixels, so they
          # are not byte-compared.
          git diff --exit-code -- assets/iso-atlas/ ':(exclude)assets/iso-atlas/groups/*.png'

  # Green-baseline ticket (2026-10-01): the default unit suite (#458) alone needs ~25 CPU-minutes of test time
  # and timed out at 10 min on a 2-4 core runner (it was slow, not hung: vitest exits cleanly). Split it across
  # three runners with vitest's --shard instead of raising the timeout; each shard runs well under 10 min.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: default unit suite (#458) shard ${{ matrix.shard }}/3
        run: npm test -- --shard=${{ matrix.shard }}/3
        timeout-minutes: 10

  # Import-only smoke tests on the platform that exposed the CLI path bug.
  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/iso-458-cli.test.ts tests/unit/iso-manifest.test.ts tests/unit/iso-building-templates.test.ts tests/unit/iso-normalize-building-art.test.ts

  # E13: Playwright never ran in CI. Desktop chromium on every PR; full
  # viewport matrix is the nightly workflow so G4/G5 mobile coverage is
  # not dropped. Iso layout assertions run on every project.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: run e2e (post failures to the PR on error)
        run: |
          set -o pipefail
          npx playwright test --project=desktop-chromium 2>&1 | tee /tmp/pw.log || {
            echo "PLAYWRIGHT_FAILED"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              grep -aE "✘|✓|failed|passed|Error|expect|at .*spec" /tmp/pw.log \
                | grep -av "npm warn" | tail -n 120 > /tmp/pw-fail.txt || true
              jq -Rs --arg id "pw-${{ github.run_id }}" \
                '{body: ("### e2e failure (run " + $id + ")\n```\n" + . + "\n```")}' \
                /tmp/pw-fail.txt > /tmp/pw-body.json
              curl -sf -X POST -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -d @/tmp/pw-body.json || echo "(could not post comment)"
            fi
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # #132: the desktop MULTIPLAYER e2e — two browser contexts, one real room,
  # the real room sidecar and the production SDK adapter. It cannot share the
  # job above: that suite runs `vite preview` of the built app, where the room
  # plugin is absent and the SDK answers with its offline mock, so a room test
  # there would prove nothing. This job runs the dev server (port 5173) with
  # the suite's rooms file `rundot/realtime.e2e.config.json` and the suite's own
  # Playwright config. The file pins the room's reconnect grace to the shipped
  # 60s: the departure specs wait that grace out on purpose, which is most of
  # this job's wall clock — hence the generous timeout.
  e2e-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mp
      # The traces/videos/consoles a failed two-client run needs, and the
      # report. `test-results-mp/` is where `retain-on-failure` writes them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-multiplayer-report
          path: |
            playwright-report-mp/
            test-results-mp/
