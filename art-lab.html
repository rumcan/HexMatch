<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HexMatch — Art Lab</title>
<style>
  :root{--bg:#0e141b;--panel:#1c242e;--line:#2c3846;--ink:#e6edf5;
        --muted:#8fa3b8;--accent:#4da3ff;--good:#3ecf8e;--warn:#ffb648;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
       font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;
       background:radial-gradient(circle at 50% 40%,#1a2531,#0a0e13);cursor:grab}
  #map.drag{cursor:grabbing}
  #lab{position:fixed;top:12px;right:12px;width:430px;max-height:calc(100vh - 24px);
       background:var(--panel);border:1px solid var(--line);border-radius:10px;
       display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10}
  #lab.min{max-height:44px;overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
       cursor:move;user-select:none}
  .bar h1{font-size:13px;margin:0;font-weight:600;flex:1}
  button{background:#26313d;color:var(--ink);border:1px solid var(--line);
         border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  .body{overflow:auto;padding:0}
  .row{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
  select,input[type=search]{background:#0f151c;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 8px;font-size:12px}
  select{flex:1}
  .selinfo{font-size:11px;color:var(--muted);padding:2px 10px 8px}
  .selinfo b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:10px}
  .opt{background:#0f151c;border:1px solid var(--line);border-radius:6px;padding:3px;
       cursor:pointer;text-align:center}
  .opt:hover{border-color:var(--accent)}
  .opt.cur{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
  .opt canvas{display:block;margin:0 auto}
  .opt .lbl{font-size:9px;color:var(--muted);margin-top:1px;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .hint{font-size:11px;color:var(--muted);padding:6px 10px;background:#101820}
  #err{position:fixed;top:0;left:0;right:0;background:#5a1d1d;color:#fff;padding:10px 16px;z-index:20;display:none}
  .changed{color:var(--warn)}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="err"></div>

<div id="lab">
  <div class="bar" id="drag">
    <h1>Art Lab</h1>
    <span id="count" style="font-size:11px;color:var(--muted)"></span>
    <button id="min">–</button>
  </div>
  <div class="body" id="body">
    <div class="row"><select id="cell"></select></div>
    <div class="selinfo" id="selinfo"></div>
    <div class="row">
      <input type="search" id="q" placeholder="filter by number…" style="flex:1">
      <button data-src="landscape" id="bL" class="primary">Land</button>
      <button data-src="buildings" id="bB">Build</button>
    </div>
    <div class="hint">Changes appear on the map instantly. Drag the map to pan, scroll to zoom.</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="row" style="border-top:1px solid var(--line);border-bottom:none">
    <button id="reset" style="flex:1">Revert all</button>
    <button id="export" class="primary" style="flex:2">Export cells.json</button>
  </div>
</div>

<script type="module">
const HERE = new URL(".", location.href).href;
const BASE = HERE + "src/iso/kenny/";
const CELLS = [HERE + "tools/iso-atlas.cells.json", HERE + "../tools/iso-atlas.cells.json"];
const HW = 66, HH = 32;

function fail(msg){ const e=document.getElementById("err"); e.style.display="block"; e.innerHTML=msg; }

let cellsDoc=null;
for (const u of CELLS){ try{ const r=await fetch(u); if(r.ok){ cellsDoc=await r.json(); break; } }catch{} }
if(!cellsDoc){ fail(`Could not load <code>tools/iso-atlas.cells.json</code>. Put art-lab.html in the repo root and run the dev server.`); throw new Error("no cells"); }

const original = new Map(cellsDoc.sprites.map(s=>[s.name,s.png]));
const current  = new Map(original);
const byName   = new Map(cellsDoc.sprites.map(s=>[s.name,s]));

const CANDIDATES = {
  landscape: Array.from({length:130},(_,i)=>`landscape/PNG/landscapeTiles_${String(i).padStart(3,"0")}.png`),
  buildings: Array.from({length:130},(_,i)=>`buildings/PNG/buildingTiles_${String(i).padStart(3,"0")}.png`),
};

const cache=new Map();
function load(png){
  if(cache.has(png)) return cache.get(png);
  const p=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=BASE+png; });
  cache.set(png,p); return p;
}
const ready=new Map();
async function warm(png){ const im=await load(png); if(im) ready.set(png,im); return im; }

// representative layout so every editable cell is visible at once.
// Roads and rails are NOT hand-placed masks — that is how pieces used to sit
// beside each other with their arms not lining up (the "disconnected road"
// bug). Instead each network below is a set of PATH polylines, and every
// tile's mask is computed from which of its four neighbours carries the same
// kind, so a piece's arms always point at the tiles that continue the route
// and adjacent pieces connect BY CONSTRUCTION.
const W=11,H=9, LAYOUT=[];
const key=(tx,ty)=>tx+"."+ty;
const ROUGH=new Set(["4.1","7.3","3.7","9.6"]);   // rough patches under no track
for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){
  let g="terrain_grass";
  if(tx===0||ty===0||tx===W-1||ty===H-1) g="terrain_water";
  else if(ROUGH.has(key(tx,ty))) g="terrain_rough";
  LAYOUT.push({tx,ty,ground:g});
}
const at=(tx,ty)=>LAYOUT.find(c=>c.tx===tx&&c.ty===ty);
const build=(tx,ty,n)=>{const c=at(tx,ty);if(c){c.ground="terrain_grass";c.build=n;}};

// The game's bit convention (src/iso/track.ts): NE=1, SE=2, SW=4, NW=8 over
// the tile-neighbour offsets below, and spriteKey pads the nibble MSB-left —
// "1011" reads NW,SW,SE,NE. Compute masks from neighbours, never by hand.
const TRACK_DIR={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]};
const maskOf=(set,kind,tx,ty)=>{
  let bits=0;
  for(const b of [8,4,2,1]){
    const [dx,dy]=TRACK_DIR[b];
    if(set.has(key(tx+dx,ty+dy))) bits|=b;
  }
  return `${kind}_${bits.toString(2).padStart(4,"0")}`;
};

// ── the layout: contiguous tile walks (each run is one connected route) ───
// avenue + corridor cross at (6,4) → road_1111; the S-bend gives curves and
// a T off the avenue; the rail column crosses the avenue at (2,4) — a level
// crossing where the road runs one diagonal (road_1010) and the rail the
// other (rail_0101), drawn as road sprite + rail sprite + crossing overlay
// exactly like the in-game renderer draws a tile carrying both layers.
const ROADS=[
  [[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4]],  // avenue
  [[6,1],[6,2],[6,3],[6,4],[6,5],[6,6],[6,7]],              // corridor
  [[3,4],[3,5],[4,5],[4,6],[5,6],[5,7]],                    // S-bend
];
const RAILS=[
  [[2,2],[2,3],[2,4],[2,5],[2,6]],                          // rail column
];
const roadSet=new Set(), railSet=new Set();
for(const run of ROADS) for(const [tx,ty] of run) roadSet.add(key(tx,ty));
for(const run of RAILS) for(const [tx,ty] of run) railSet.add(key(tx,ty));
for(const k of roadSet){
  const [tx,ty]=k.split(".").map(Number); const c=at(tx,ty); if(!c) continue;
  c.ground=maskOf(roadSet,"road",tx,ty);
  if(railSet.has(k)) c.rail=maskOf(railSet,"rail",tx,ty);   // level crossing tile
}
for(const k of railSet){
  const [tx,ty]=k.split(".").map(Number); const c=at(tx,ty); if(!c||roadSet.has(k)) continue;
  c.ground=maskOf(railSet,"rail",tx,ty);                    // rail-only tiles
}
for(const k of railSet) if(roadSet.has(k)){
  const [tx,ty]=k.split(".").map(Number); const c=at(tx,ty); if(c) c.crossing=true;
}

const IND=["farm","forest","ore_mine","quarry","oil_rig","gold_mine"];
const spots=[[2,1],[1,3],[1,6],[2,7],[9,3],[8,6]];
IND.forEach((n,i)=>{const c=at(spots[i][0],spots[i][1]);if(c){c.ground="terrain_grass";c.build=n;}});
const ff=at(8,1); if(ff)ff.build="factory_blue";

let camX=0,camY=0,zoom=0.9;
const map=document.getElementById("map");
function resize(){ map.width=innerWidth*devicePixelRatio; map.height=innerHeight*devicePixelRatio;
  map.style.width=innerWidth+"px"; map.style.height=innerHeight+"px"; draw(); }
addEventListener("resize",resize);
function recenter(){ camX=innerWidth*0.42; camY=innerHeight*0.30; zoom=0.9; draw(); }

async function ensureLoaded(){
  const need=new Set();
  for(const c of LAYOUT){
    need.add(current.get(c.ground));
    if(c.rail) need.add(current.get(c.rail));
    if(c.crossing) need.add(current.get("crossing"));
    if(c.build) need.add(current.get(c.build));
  }
  await Promise.all([...need].filter(Boolean).map(warm));
}

function draw(){
  const ctx=map.getContext("2d");
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const k=zoom;
  const items=[...LAYOUT].sort((a,b)=>(a.tx+a.ty)-(b.tx+b.ty));
  const spr=(png,tx,ty)=>{ const im=ready.get(png); if(!im)return;
    const sx=camX+(tx-ty)*HW*k, sy=camY+(tx+ty)*HH*k, w=im.width*k, h=im.height*k;
    ctx.drawImage(im, sx-w/2, sy-h+HH*k, w, h); };
  for(const c of items){
    spr(current.get(c.ground),c.tx,c.ty);
    // a level-crossing tile draws road, then rail, then the crossing overlay
    // on top — the same three sprites the in-game renderer draws.
    if(c.crossing){ spr(current.get(c.rail),c.tx,c.ty); spr(current.get("crossing"),c.tx,c.ty); }
    else if(c.rail) spr(current.get(c.rail),c.tx,c.ty);
    if(c.build) spr(current.get(c.build),c.tx,c.ty);
  }
}

map.addEventListener("pointerdown",e=>{ map.setPointerCapture(e.pointerId); map.classList.add("drag");
  map._px=e.clientX; map._py=e.clientY; });
map.addEventListener("pointermove",e=>{ if(map._px==null||!e.buttons)return;
  camX+=e.clientX-map._px; camY+=e.clientY-map._py; map._px=e.clientX; map._py=e.clientY; draw(); });
map.addEventListener("pointerup",()=>{ map._px=map._py=null; map.classList.remove("drag"); });
map.addEventListener("wheel",e=>{ e.preventDefault();
  const f=e.deltaY<0?1.1:0.9; zoom=Math.max(0.3,Math.min(2.5,zoom*f)); draw(); },{passive:false});

let selected=cellsDoc.sprites[0].name, src="landscape", q="";

function fillCellSelect(){
  const sel=document.getElementById("cell"); sel.innerHTML="";
  const groups={};
  for(const s of cellsDoc.sprites){
    let g="Building";
    if(s.name.startsWith("terrain"))g="Terrain";
    else if(s.name.startsWith("road"))g="Road";
    else if(s.name.startsWith("rail"))g="Rail";
    else if(s.kind==="vehicle"||s.heading)g="Vehicle";
    else if(s.name.includes("highlight")||s.name.includes("crossing"))g="Overlay";
    (groups[g] ??= []).push(s.name);
  }
  for(const [g,names] of Object.entries(groups)){
    const og=document.createElement("optgroup"); og.label=g;
    for(const n of names){ const o=document.createElement("option"); o.value=n;
      o.textContent=(current.get(n)!==original.get(n)?"● ":"")+n; og.appendChild(o); }
    sel.appendChild(og);
  }
  sel.value=selected;
}
document.getElementById("cell").onchange=e=>{ selected=e.target.value; renderGrid(); renderSelInfo(); };

async function renderSelInfo(){
  const png=current.get(selected); const im=await load(png); const s=byName.get(selected);
  const chg=current.get(selected)!==original.get(selected);
  document.getElementById("selinfo").innerHTML=
    `<b>${selected}</b> — ${png.split("/").pop()} ${im?`(${im.width}×${im.height})`:""}
     ${chg?'<span class="changed">● changed</span>':""} · footprint ${JSON.stringify(s.footprint)}`;
}

async function thumb(cv,png,scale){ const im=await load(png); const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!im){ctx.fillStyle="#803";ctx.fillRect(0,0,cv.width,cv.height);return;}
  const w=im.width*scale,h=im.height*scale; ctx.imageSmoothingEnabled=true;
  ctx.drawImage(im,(cv.width-w)/2,cv.height-h-1,w,h); }

function renderGrid(){
  const host=document.getElementById("grid"); host.innerHTML="";
  const list=CANDIDATES[src].filter(p=>!q||p.includes(q));
  for(const png of list){
    const d=document.createElement("div"); d.className="opt"+(current.get(selected)===png?" cur":"");
    const cv=document.createElement("canvas"); cv.width=82; cv.height=64;
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=png.split("_").pop().replace(".png","");
    d.append(cv,lbl);
    d.onclick=async()=>{ current.set(selected,png); await warm(png);
      renderGrid(); renderSelInfo(); fillCellSelect(); updateCount(); draw(); };
    host.appendChild(d); thumb(cv,png,0.55);
  }
}
document.getElementById("q").oninput=e=>{q=e.target.value;renderGrid();};
for(const b of document.querySelectorAll("[data-src]")) b.onclick=()=>{
  src=b.dataset.src; document.getElementById("bL").classList.toggle("primary",src==="landscape");
  document.getElementById("bB").classList.toggle("primary",src==="buildings"); renderGrid(); };

function updateCount(){ const n=[...current].filter(([k,v])=>v!==original.get(k)).length;
  document.getElementById("count").textContent=n?`${n} changed`:""; }

document.getElementById("reset").onclick=async()=>{ for(const[k,v]of original)current.set(k,v);
  await ensureLoaded(); fillCellSelect(); renderGrid(); renderSelInfo(); updateCount(); draw(); };

document.getElementById("export").onclick=()=>{
  const out=structuredClone(cellsDoc);
  for(const s of out.sprites) s.png=current.get(s.name);
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="iso-atlas.cells.json"; a.click();
};

document.getElementById("min").onclick=()=>document.getElementById("lab").classList.toggle("min");
(function(){ const lab=document.getElementById("lab"),bar=document.getElementById("drag");
  let dx,dy,on=false;
  bar.addEventListener("pointerdown",e=>{ if(e.target.id==="min")return; on=true;
    const r=lab.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener("pointermove",e=>{ if(!on)return;
    lab.style.left=(e.clientX-dx)+"px"; lab.style.top=(e.clientY-dy)+"px"; lab.style.right="auto"; });
  bar.addEventListener("pointerup",()=>on=false);
})();

fillCellSelect(); renderGrid(); renderSelInfo(); updateCount();
await ensureLoaded(); resize(); recenter();
</script>
</body>
</html>
